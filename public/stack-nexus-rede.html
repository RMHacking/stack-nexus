<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack_n3xus — a rede (sud0)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#18191a;--surface:#242526;--surface-2:#3a3b3c;--hover:#303132;--border:#393a3b;
    --text:#e4e6eb;--text-dim:#b0b3b8;--text-faint:#8a8d91;
    --accent:#1877f2;--accent-soft:rgba(24,119,242,.14);--ok:#31a24c;
    --crown:#f4c430;--crown-glow:rgba(244,196,48,.2);--crown-soft:rgba(244,196,48,.1);--genesis:#c7891f;
    --danger:#e41e3f;--danger-soft:rgba(228,30,63,.1);
    --font-mono:"JetBrains Mono",ui-monospace,monospace;--font-sans:"Inter",system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(circle at 50% -8%,rgba(244,196,48,.05),transparent 55%);}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit;cursor:pointer;border:0;}
  input{font-family:inherit;}
  .wrap{max-width:820px;margin:0 auto;padding:2rem 1.4rem 4rem;}
  .brand{font-family:var(--font-mono);font-weight:700;font-size:1.3rem;text-align:center;}
  .brand b{color:var(--accent);}
  .h{display:flex;align-items:center;gap:.5rem;justify-content:center;margin:.6rem 0 1.6rem;font-family:var(--font-mono);font-size:.72rem;color:var(--crown);}

  /* login box */
  .login{max-width:360px;margin:2rem auto 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.5rem;}
  .login h2{font-size:1.05rem;margin-bottom:.3rem;}
  .login p{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);margin-bottom:1rem;}
  label{display:block;font-family:var(--font-mono);font-size:.66rem;color:var(--text-dim);margin:.7rem 0 .3rem;}
  input.f{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:.65rem .8rem;color:var(--text);font-size:.88rem;outline:none;}
  input.f:focus{border-color:var(--crown);}
  .btn{width:100%;border-radius:9px;padding:.7rem;font-weight:600;font-size:.88rem;margin-top:1.1rem;background:var(--crown);color:#1a1400;}
  .btn:hover{filter:brightness(1.06);}
  .note{font-family:var(--font-mono);font-size:.7rem;text-align:center;margin-top:.8rem;color:var(--danger);display:none;}
  .note.show{display:block;}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.4rem;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem;text-align:center;}
  .stat .v{font-family:var(--font-mono);font-size:1.8rem;font-weight:700;}
  .stat .v.crown{color:var(--crown);}
  .stat .l{font-family:var(--font-mono);font-size:.62rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:.2rem;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);}
  .panel-h .t{font-weight:600;font-size:.92rem;}
  .panel-h .s{font-family:var(--font-mono);font-size:.64rem;color:var(--text-faint);}
  .refresh{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;padding:.35rem .7rem;}
  .refresh:hover{color:var(--text);border-color:var(--text-faint);}
  .entry{display:flex;align-items:center;gap:.8rem;padding:.75rem 1.1rem;border-bottom:1px solid rgba(57,58,59,.5);}
  .entry:last-child{border-bottom:0;}
  .entry .av{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:.72rem;color:var(--text-dim);flex:none;}
  .entry .who{flex:1;min-width:0;}
  .entry .nm{font-weight:600;font-size:.88rem;}
  .entry .path{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .path b{color:var(--accent);}
  .entry .num{font-family:var(--font-mono);font-size:.66rem;color:var(--crown);flex:none;}
  .empty{padding:2rem;text-align:center;font-family:var(--font-mono);font-size:.78rem;color:var(--text-faint);line-height:1.6;}
  .logout{display:block;margin:1.2rem auto 0;font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);background:transparent;border:1px solid var(--border);border-radius:7px;padding:.4rem .9rem;}
  .logout:hover{color:var(--text);}
  .cfg{font-family:var(--font-mono);font-size:.6rem;color:var(--text-faint);text-align:center;margin-top:1rem;}
  .cfg input{background:transparent;border:0;border-bottom:1px solid var(--border);color:var(--text-dim);font-family:inherit;font-size:.6rem;width:170px;text-align:center;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Stack_<b>n3xus</b></div>
  <div class="h">♛ a rede — visão do sud0</div>

  <!-- LOGIN -->
  <div class="login" id="loginBox">
    <h2>Entrar como sud0</h2>
    <p>// só o fundador vê a rede inteira</p>
    <label>email</label>
    <input class="f" id="email" value="sud0@stackn3xus.dev">
    <label>senha</label>
    <input class="f" id="senha" type="password" value="">
    <button class="btn" id="entrar">Entrar →</button>
    <div class="note" id="note"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="hidden">
    <div class="stats">
      <div class="stat"><div class="v crown" id="stMembros">–</div><div class="l">membros</div></div>
      <div class="stat"><div class="v" id="stEntradas">–</div><div class="l">entradas por convite</div></div>
      <div class="stat"><div class="v" id="stProf">–</div><div class="l">níveis na árvore</div></div>
    </div>
    <div class="panel">
      <div class="panel-h">
        <div><div class="t">Novas entradas</div><div class="s">quem entrou e por onde veio</div></div>
        <button class="refresh" id="refresh">↻ atualizar</button>
      </div>
      <div id="lista"></div>
    </div>
    <button class="logout" id="logout">sair</button>
  </div>

  <div class="cfg">servidor: <input id="apiInput" value=""></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let API = '';
  let token = null;
  $('#apiInput').addEventListener('change', e => { API = e.target.value.trim().replace(/\/$/, ''); });

  async function api(path, opt = {}) {
    const r = await fetch(API + path, {
      ...opt,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opt.headers || {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined,
    });
    return { status: r.status, body: await r.json().catch(() => ({})) };
  }

  $('#entrar').onclick = async () => {
    const note = $('#note'); note.classList.remove('show');
    try {
      const r = await api('/api/auth/login', { method: 'POST', body: { email: $('#email').value.trim(), senha: $('#senha').value } });
      if (r.status !== 200 || !r.body.token) { note.textContent = 'email ou senha incorretos'; note.classList.add('show'); return; }
      if (!r.body.conta.is_sud0) { note.textContent = 'essa conta não é o sud0'; note.classList.add('show'); return; }
      token = r.body.token;
      $('#loginBox').classList.add('hidden'); $('#dash').classList.remove('hidden');
      carregar();
    } catch (e) { note.textContent = 'sem conexão com ' + API; note.classList.add('show'); }
  };

  $('#refresh').onclick = carregar;
  $('#logout').onclick = () => { token = null; $('#dash').classList.add('hidden'); $('#loginBox').classList.remove('hidden'); };

  async function carregar() {
    const { body } = await api('/api/admin/entradas');
    const lista = Array.isArray(body) ? body : [];
    // stats
    let maxProf = 1;
    lista.forEach(e => { if (e.linhagem && e.linhagem.length + 1 > maxProf) maxProf = e.linhagem.length + 1; });
    $('#stEntradas').textContent = lista.length;
    $('#stMembros').textContent = lista.length + 1; // +1 = sud0
    $('#stProf').textContent = Math.max(1, maxProf);
    // lista
    const box = $('#lista');
    if (!lista.length) {
      box.innerHTML = '<div class="empty">Ninguém entrou por convite ainda.<br>Crie um membro em <b>stack-nexus-convite.html</b> e volte aqui.</div>';
      return;
    }
    box.innerHTML = lista.map(e => {
      const path = (e.linhagem || []).concat(e.convidado).map((h, i, a) => i === a.length - 1 ? '<b>' + h + '</b>' : h).join(' → ');
      const quando = e.concluido_em ? new Date(e.concluido_em).toLocaleString('pt-BR') : '';
      return `<div class="entry">
        <div class="av">${(e.convidado||'?').slice(0,2).toUpperCase()}</div>
        <div class="who"><div class="nm">@${e.convidado}</div><div class="path">${path}</div></div>
        <div class="num">#${e.membro_num || '?'}<br><span style="color:var(--text-faint)">${quando}</span></div>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
