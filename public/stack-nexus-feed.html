<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack_n3xus — StackFeed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#18191a;--surface:#242526;--surface-2:#3a3b3c;--hover:#303132;--border:#393a3b;
    --text:#e4e6eb;--text-dim:#b0b3b8;--text-faint:#8a8d91;
    --accent:#1877f2;--accent-soft:rgba(24,119,242,.14);--ok:#31a24c;
    --crown:#f4c430;--crown-glow:rgba(244,196,48,.2);--crown-soft:rgba(244,196,48,.09);--genesis:#c7891f;
    --cyber:#e0553f;--cyber-soft:rgba(224,85,63,.14);--danger:#e41e3f;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;--font-sans:"Inter",system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;min-height:100vh;}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit;}
  .wrap{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--border);border-right:1px solid var(--border);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.1rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(24,25,26,.9);backdrop-filter:blur(8px);z-index:5;}
  .brand{font-family:var(--font-mono);font-weight:700;font-size:1.1rem;}
  .brand b{color:var(--accent);}
  .nav{display:flex;gap:.4rem;}
  .nav button{font-family:var(--font-mono);font-size:.7rem;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;padding:.4rem .7rem;}
  .nav button:hover{color:var(--text);border-color:var(--text-faint);}
  .nav button.crown{color:var(--crown);border-color:rgba(244,196,48,.4);}

  /* composer */
  .composer{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin:1rem;}
  .composer.crown{border-top:2px solid var(--crown);}
  .composer .as{font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint);margin-bottom:.6rem;}
  .composer .as b{color:var(--crown);}
  .composer .top{display:flex;gap:.7rem;align-items:flex-start;}
  .av{border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;flex:none;background:var(--surface-2);color:var(--text-faint);}
  .av.crown{background:linear-gradient(135deg,var(--crown),var(--genesis));color:#1a1400;}
  .composer textarea{flex:1;background:transparent;border:1px solid var(--border);border-radius:16px;padding:.7rem 1rem;color:var(--text);font-size:.95rem;outline:none;font-family:inherit;resize:vertical;min-height:52px;line-height:1.5;}
  .composer textarea:focus{border-color:var(--accent);background:var(--surface-2);}
  .composer .bottom{display:flex;align-items:center;justify-content:flex-end;gap:.8rem;margin-top:.6rem;}
  .charcount{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);}
  .charcount.near{color:var(--crown);} .charcount.over{color:var(--danger);}
  .publish{color:var(--accent);font-weight:600;font-size:.9rem;padding:.5rem 1.1rem;border-radius:9px;background:var(--accent-soft);}
  .publish:hover{filter:brightness(1.1);}
  .publish:disabled{opacity:.5;cursor:default;}

  .post{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;margin:0 1rem 1rem;}
  .post.crown{border:1px solid var(--crown);box-shadow:0 0 0 3px var(--crown-glow);background:linear-gradient(180deg,var(--crown-soft),transparent 55%);}
  .post .head{display:flex;gap:.7rem;align-items:center;}
  .post .id{flex:1;min-width:0;}
  .post .name{font-weight:600;font-size:.9rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
  .crowntag{font-family:var(--font-mono);font-size:.55rem;background:var(--crown);color:#1a1400;padding:.05rem .4rem;border-radius:20px;font-weight:700;}
  .utag{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--font-mono);font-size:.56rem;padding:.05rem .4rem;border-radius:5px;background:var(--surface-2);}
  .utag .d{width:5px;height:5px;border-radius:50%;}
  .utag.tech{color:var(--accent);} .utag.tech .d{background:var(--accent);}
  .utag.cyber{color:var(--cyber);} .utag.cyber .d{background:var(--cyber);}
  .post .meta{font-family:var(--font-mono);font-size:.66rem;color:var(--text-faint);margin-top:.1rem;}
  .post .body{margin-top:.7rem;font-size:.94rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;}

  .empty{margin:2rem 1rem;padding:2rem;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--text-faint);font-family:var(--font-mono);font-size:.82rem;line-height:1.6;}
  .loading{display:grid;place-items:center;min-height:40vh;}
  .spin{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .err{display:grid;place-items:center;min-height:50vh;text-align:center;padding:2rem;}
  .err .btn{margin-top:1rem;background:var(--accent);color:#fff;border-radius:9px;padding:.7rem 1.2rem;font-weight:600;}
  .note{font-family:var(--font-mono);font-size:.68rem;text-align:center;color:var(--danger);margin:.4rem 1rem;display:none;}
  .note.show{display:block;}
  .cfg{font-family:var(--font-mono);font-size:.6rem;color:var(--text-faint);text-align:center;padding:1rem;}
  .cfg input{background:transparent;border:0;border-bottom:1px solid var(--border);color:var(--text-dim);font-family:inherit;font-size:.6rem;width:170px;text-align:center;}
  .pmenu-wrap{position:relative;flex:none;margin-left:.4rem;}
  .pmenu-btn{color:var(--text-faint);font-size:1.2rem;padding:0 .4rem;border-radius:6px;line-height:1;background:transparent;border:0;cursor:pointer;}
  .pmenu-btn:hover{background:var(--hover);color:var(--text);}
  .pmenu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:.3rem;min-width:170px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .pmenu button{display:block;width:100%;text-align:left;padding:.5rem .6rem;border-radius:6px;font-size:.82rem;color:var(--text);background:transparent;border:0;cursor:pointer;}
  .pmenu button:hover{background:var(--hover);}.pmenu button.danger{color:var(--danger);}
  .pin-badge{font-family:var(--font-mono);font-size:.6rem;color:var(--crown);background:var(--crown-soft);border:1px solid var(--crown);border-radius:20px;padding:.12rem .55rem;display:inline-block;margin-bottom:.6rem;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Stack_<b>n3xus</b></div>
    <div class="nav">
      <button id="navPerfil">meu perfil</button>
      <button id="navRede" class="crown" style="display:none">a rede</button>
      <button id="navSair">sair</button>
    </div>
  </div>

  <div id="loading" class="loading"><div class="spin"></div></div>

  <div id="erro" class="err hidden">
    <div>
      <h2 style="font-size:1.1rem" id="errT">Você não está conectado</h2>
      <p style="color:var(--text-dim);font-size:.88rem;margin-top:.4rem" id="errS">Entre para ver o StackFeed.</p>
      <button class="btn" onclick="location.href='stack-nexus-login.html'">Ir para o login →</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- composer -->
    <div class="composer" id="composer">
      <div class="as hidden" id="asCrown">publicando como <b>♛ sud0</b> — aparição pública</div>
      <div class="top">
        <span class="av" id="cpAv" style="width:42px;height:42px">··</span>
        <textarea id="cpText" maxlength="500" placeholder="Começar publicação... (o que você constrói é sua reputação aqui)"></textarea>
      </div>
      <div class="bottom">
        <span class="charcount" id="cpCount">0 / 500</span>
        <button class="publish" id="cpPublish">Publicar</button>
      </div>
    </div>
    <div class="note" id="note"></div>

    <div id="lista"></div>
  </div>

  <div class="cfg">servidor: <input id="apiInput" value=""></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let API = '';
  $('#apiInput').value = API;
  $('#apiInput').addEventListener('change', e => { API = e.target.value.trim().replace(/\/$/, ''); location.reload(); });

  let token = null;
  try { token = localStorage.getItem('sn_token'); } catch(e){}
  let eu = null, souSud0 = false;

  const iniciais = (s) => (s||'?').replace(/[^A-Za-zÀ-ÿ0-9]/g,'').slice(0,2).toUpperCase() || '··';
  function show(id){ ['loading','erro','app'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==id)); }
  function api(path, opt={}){ return fetch(API+path, {...opt, headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}, body: opt.body?JSON.stringify(opt.body):undefined}); }

  function tempo(iso){
    const d = (Date.now() - new Date(iso).getTime())/1000;
    if(d < 60) return 'agora';
    if(d < 3600) return 'há '+Math.floor(d/60)+'min';
    if(d < 86400) return 'há '+Math.floor(d/3600)+'h';
    return 'há '+Math.floor(d/86400)+'d';
  }
  const esc = (s)=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function trilhaTag(t){
    if(!t) return '';
    if(t==='both') return '<span class="utag tech"><span class="d"></span>tech</span> <span class="utag cyber"><span class="d"></span>cyber</span>';
    const cls = t==='cyber'?'cyber':'tech';
    return '<span class="utag '+cls+'"><span class="d"></span>'+t+'</span>';
  }

  function menuPost(p){
    let items='';
    if(p.meu){ items+='<button data-act="editar">✎ editar</button><button data-act="apagar" class="danger">🗑 apagar</button>'; }
    else if(souSud0){ items+='<button data-act="apagar" class="danger">🗑 apagar (moderar)</button>'; }
    if(souSud0){ items+='<button data-act="'+(p.fixado?'desafixar':'fixar')+'">'+(p.fixado?'✕ desafixar':'📌 fixar no topo')+'</button>'; }
    return items?'<div class="pmenu-wrap"><button class="pmenu-btn" data-menu-toggle>⋯</button><div class="pmenu" hidden>'+items+'</div></div>':'';
  }
  function postHTML(p){
    const a = p.autor, menu=menuPost(p);
    const pin = p.fixado ? '<div class="pin-badge">📌 fixado pelo fundador</div>' : '';
    const ed = p.editado ? ' · editado' : '';
    if(a.is_sud0){
      return `<article class="post crown" data-id="${p.id}">${pin}
        <div class="head"><span class="av crown" style="width:42px;height:42px">♛</span>
          <div class="id"><div class="name">sud0/n3xus <span class="crowntag">♛ MASTER</span></div>
          <div class="meta">◆ entidade fundadora · ${tempo(p.criado_em)}${ed}</div></div>${menu}</div>
        <div class="body">${esc(p.corpo)}</div></article>`;
    }
    const nome = a.nome || ('@'+a.handle);
    const sub = (a.nome ? ('@'+a.handle+' · ') : '')+tempo(p.criado_em)+ed;
    return `<article class="post" data-id="${p.id}">${pin}
      <div class="head"><span class="av" style="width:42px;height:42px">${iniciais(a.nome||a.handle)}</span>
        <div class="id"><div class="name">${esc(nome)} ${trilhaTag(a.trilha)}</div>
        <div class="meta">${esc(sub)}</div></div>${menu}</div>
      <div class="body">${esc(p.corpo)}</div></article>`;
  }
  function acaoPost(id,act,art){
    if(act==='apagar'){ api('/api/posts/'+id,{method:'DELETE'}).then(()=>carregar()); return; }
    if(act==='fixar'||act==='desafixar'){ api('/api/posts/'+id+'/fixar',{method:'POST',body:{fixar:act==='fixar'}}).then(()=>carregar()); return; }
    if(act==='editar'){ editarPost(id,art); }
  }
  function editarPost(id,art){
    const body=art.querySelector('.body'); if(!body) return; const atual=body.textContent;
    body.innerHTML='<textarea class="edit-ta" maxlength="500" style="width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--accent);border-radius:8px;color:var(--text);padding:.6rem;font-family:inherit;font-size:.92rem;line-height:1.5;min-height:60px;"></textarea><div style="display:flex;gap:.5rem;margin-top:.4rem;justify-content:flex-end"><button class="ed-cancel" style="font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim);border:1px solid var(--border);border-radius:7px;padding:.4rem .8rem;background:transparent;cursor:pointer">cancelar</button><button class="ed-save" style="font-family:var(--font-mono);font-size:.72rem;color:#fff;background:var(--accent);border:0;border-radius:7px;padding:.4rem .9rem;cursor:pointer">salvar</button></div>';
    const ta=body.querySelector('.edit-ta'); ta.value=atual; ta.focus();
    body.querySelector('.ed-cancel').onclick=()=>carregar();
    body.querySelector('.ed-save').onclick=()=>{const v=ta.value.trim(); if(!v)return; api('/api/posts/'+id,{method:'PATCH',body:{corpo:v}}).then(()=>carregar());};
  }
  document.addEventListener('click',(e)=>{
    const tog=e.target.closest('[data-menu-toggle]');
    const actBtn=e.target.closest('.pmenu [data-act]');
    if(tog){ e.stopPropagation(); const pm=tog.parentElement.querySelector('.pmenu'); const open=!pm.hidden; document.querySelectorAll('.pmenu').forEach(m=>m.hidden=true); pm.hidden=open; return; }
    if(actBtn){ e.stopPropagation(); const art=actBtn.closest('article.post'); const id=art&&art.getAttribute('data-id'); document.querySelectorAll('.pmenu').forEach(m=>m.hidden=true); if(id) acaoPost(id,actBtn.getAttribute('data-act'),art); return; }
    document.querySelectorAll('.pmenu').forEach(m=>m.hidden=true);
  });

  async function carregar(){
    if(!token){ show('erro'); return; }
    try{
      const meR = await api('/api/me/perfil');
      if(meR.status===401){ $('#errT').textContent='Sessão expirada'; $('#errS').textContent='Entre de novo.'; show('erro'); return; }
      eu = await meR.json();
      souSud0 = !!(eu && eu.is_sud0);
      // composer com a identidade
      $('#cpAv').textContent = eu.is_sud0 ? '♛' : iniciais(eu.nome||eu.handle);
      if(eu.is_sud0){ $('#cpAv').classList.add('crown'); $('#asCrown').classList.remove('hidden'); $('#composer').classList.add('crown'); $('#navRede').style.display=''; }
      const feed = await (await api('/api/feed')).json();
      render(feed);
      show('app');
    }catch(e){
      $('#errT').textContent='Sem conexão com o servidor';
      $('#errS').innerHTML='O backend está rodando? ('+API+')';
      show('erro');
    }
  }

  function render(feed){
    const box = $('#lista');
    if(!feed.length){ box.innerHTML = '<div class="empty">Ainda não tem nada no feed.<br>Seja o primeiro a publicar. 👆</div>'; return; }
    box.innerHTML = feed.map(postHTML).join('');
  }

  // composer
  const txt = $('#cpText'), count = $('#cpCount'), pub = $('#cpPublish');
  txt.addEventListener('input', ()=>{
    const n = txt.value.length;
    count.textContent = n+' / 500';
    count.classList.toggle('near', n>=425 && n<500);
    count.classList.toggle('over', n>=500);
  });
  pub.addEventListener('click', async ()=>{
    const corpo = txt.value.trim();
    const note = $('#note'); note.classList.remove('show');
    if(!corpo){ return; }
    pub.disabled = true; pub.textContent = 'publicando…';
    try{
      const r = await api('/api/posts', { method:'POST', body:{ corpo } });
      const data = await r.json();
      if(!data.ok){ note.textContent = 'não deu pra publicar ('+(data.erro||'')+')'; note.classList.add('show'); }
      else {
        txt.value=''; count.textContent='0 / 500';
        // recarrega o feed (jeito simples e confiável)
        const feed = await (await api('/api/feed')).json();
        render(feed);
      }
    }catch(e){ note.textContent='erro de conexão'; note.classList.add('show'); }
    pub.disabled=false; pub.textContent='Publicar';
  });

  $('#navPerfil').onclick = ()=>location.href='stack-nexus-perfil.html';
  $('#navRede').onclick = ()=>location.href='stack-nexus-rede.html';
  $('#navSair').onclick = ()=>{ try{localStorage.removeItem('sn_token');localStorage.removeItem('sn_handle');}catch(e){} location.href='stack-nexus-login.html'; };

  carregar();
</script>
</body>
</html>
